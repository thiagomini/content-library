name: CI

on:
    pull_request:
    push:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # Which apps does this change affect? A member PR → that member's app.
    # A change to configs/, the starter or the lockfile → every app, because
    # shared infra can break everyone at once.
    changes:
        runs-on: ubuntu-latest
        outputs:
            apps: ${{ steps.detect.outputs.apps }}
            any: ${{ steps.detect.outputs.any }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            # A pull_request diffs against the branch it targets. A push has no
            # base_ref, and diffing main against itself finds nothing — which is
            # what skipped every app job. `github.event.before` is the tip the
            # branch had before the push; it is all-zeros on a first push, and
            # the script treats any undiffable base as "infra changed".
            - id: base
              env:
                  BASE_REF: ${{ github.base_ref }}
                  BEFORE: ${{ github.event.before }}
              run: |
                  if [ -n "$BASE_REF" ]; then
                      echo "ref=origin/$BASE_REF" >> "$GITHUB_OUTPUT"
                  else
                      echo "ref=$BEFORE" >> "$GITHUB_OUTPUT"
                  fi

            - id: detect
              run: node scripts/changed-apps.mjs '${{ steps.base.outputs.ref }}'

    # Guardrail, not a test: fails a member PR that reaches outside its own
    # directory. CODEOWNERS routes reviews but enforces nothing.
    scope:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - run: node scripts/check-scope.mjs origin/${{ github.base_ref }}
              env:
                  PR_AUTHOR: ${{ github.event.pull_request.user.login }}

    # One job, three gates. Every step runs even when an earlier one failed, so
    # a PR gets its formatting, lint and type errors in a single report instead
    # of one per push. All three are repo-wide — Prettier walks every file,
    # ESLint v10 resolves each file's config from the nearest ancestor
    # eslint.config.mjs, and the root typecheck fans out over the workspaces —
    # so none of them depends on `changes`.
    quality:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - name: prettier
              run: npm run format:check
            - name: eslint
              if: '!cancelled()'
              run: npm run lint
            - name: tsc
              if: '!cancelled()'
              run: npm run typecheck

    unit:
        needs: changes
        if: needs.changes.outputs.any == 'true'
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                app: ${{ fromJSON(needs.changes.outputs.apps) }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run test:unit
              working-directory: ${{ matrix.app }}

    # Cheap, and the only place a dev-only mistake (a story imported from
    # src/, a missing asset) is caught before merge.
    build:
        needs: changes
        if: needs.changes.outputs.any == 'true'
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                app: ${{ fromJSON(needs.changes.outputs.apps) }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run build
              working-directory: ${{ matrix.app }}

    integration:
        needs: changes
        if: needs.changes.outputs.any == 'true'
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                app: ${{ fromJSON(needs.changes.outputs.apps) }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci

            # Without this cache the browser download dominates the job. Keyed on
            # the lockfile so it busts when Playwright is bumped.
            - uses: actions/cache@v4
              id: pw-cache
              with:
                  path: ~/.cache/ms-playwright
                  key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
            - run: npx playwright install --with-deps chromium
              if: steps.pw-cache.outputs.cache-hit != 'true'
            # Cached browsers don't bring their system libraries.
            - run: npx playwright install-deps chromium
              if: steps.pw-cache.outputs.cache-hit == 'true'

            - run: npm run test:integration:headless
              working-directory: ${{ matrix.app }}

            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-report-${{ strategy.job-index }}
                  path: ${{ matrix.app }}/playwright-report/
                  retention-days: 7

    # Branch protection can only require checks by name, but the per-app jobs
    # are a matrix whose names depend on which apps changed — there is no fixed
    # name to require. This gate collapses every job into one status: make `ci`
    # the single required check and nothing merges while anything is red.
    ci:
        if: always()
        needs: [changes, scope, quality, unit, build, integration]
        runs-on: ubuntu-latest
        steps:
            # "skipped" is a legitimate outcome: `scope` only runs on pull
            # requests, and the per-app jobs sit out a change that touched no
            # app. A job skipped because its own dependency failed is still
            # caught, because that dependency reports "failure".
            - name: Verify every job passed
              env:
                  RESULTS: ${{ join(needs.*.result, ' ') }}
              run: |
                  echo "Job results: $RESULTS"
                  for result in $RESULTS; do
                      case "$result" in
                          success | skipped) ;;
                          *)
                              echo "::error::A required job reported '$result'."
                              exit 1
                              ;;
                      esac
                  done
                  echo "All required jobs passed."
